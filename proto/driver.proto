syntax = "proto3";

option csharp_namespace = "Remaestro.Grpc";

// **`protoc-gen-go` refuses to run without this line**, and that makes it the first thing a plugin author
// outside .NET hits — before they have generated a single message:
//
//     protoc-gen-go: unable to determine Go import path for "driver.proto"
//     Please specify either: a "go_package" option in the .proto source file, or a "M" argument …
//
// Every other generator defaults something. Go treats a missing import path as fatal, so a file carrying a
// `csharp_namespace` and nothing else says, at the first step, that this contract was written for one
// language. The path below does not have to be a module anybody can `go get` — it is the default import
// path for the generated package, and an author who wants their stubs somewhere else still overrides it
// with `--go_opt=M<file>=<path>` exactly as they would have had to anyway. What it buys is that the
// stock command *works*. `samples/go/package.sh` is the worked example.
//
// The `;maestro` suffix is the Go package name and is not decoration: without it protoc-gen-go names the
// package after the last path element, and a Go package called `proto` shadows the one every generated
// file already imports.
option go_package = "github.com/Redth/remaestro-sdk/proto;maestro";

package maestro;

// ---- The compatibility promise ------------------------------------------------------------------------
//
// This file is the whole contract between the hub and a driver, in any language. Plugins are built by
// people who cannot see the hub's source and cannot be rebuilt when it changes, so the rules below are
// not style — they are what makes a plugin published today still work against a hub shipped next year.
//
//   1. A field number is never reused and never renamed. Not even for a field nobody appears to send:
//      the hub hashes numbers *and* names to decide whether a cached descriptor is still readable
//      (`DriverManifest.Contract()`), "because a rename is a different meaning even at the same number".
//   2. Fields are only added, at fresh numbers. A removed field is `reserved`, never recycled.
//   3. Rpcs are only added. A driver that has never heard of one answers UNIMPLEMENTED, and the hub reads
//      that as "this plugin is older than this feature" rather than as a fault. See GetRemote below.
//   4. The meaning of an existing field is never narrowed. Widening — one more allowed string in a list
//      whose unknown values are already ignored — is the only change that is safe in place.
//
// Anything that cannot be done under those four rules is a new protocol version, declared here and
// negotiated on Describe.

// Which revision of this file a party was built against. One integer, bumped whenever the four rules
// above are not enough — never for an added field, because an added field is exactly what they permit.
//
// **The current version is the highest value in this enum.** That is the definition, so a generated SDK
// can compute it rather than carrying a constant that drifts from the file it came from; the .NET SDK's
// `DriverProtocol.Current` does exactly that, and a test asserts the two agree.
enum Protocol {
  PROTOCOL_UNSPECIFIED = 0;   // nobody was asked, or the party predates negotiation entirely

  // 1 — negotiation itself, `DriverDescriptor.capabilities`, `Availability` on the six optional answers,
  // the declared heartbeat interval and its independence, and declared holds. The first version there is
  // any way to ask about, which is why it is also the first that can be refused.
  PROTOCOL_V1 = 1;
}

// A driver runs out-of-process and hosts this service; the hub is the gRPC client.
// One driver process can host many device instances (all events multiplex over one stream).
service Driver {
  rpc Describe (DescribeRequest) returns (DriverDescriptor);
  rpc CreateDevice (CreateDeviceRequest) returns (CreateDeviceResponse);
  rpc ExecuteCommand (ExecuteCommandRequest) returns (ExecuteCommandResponse);
  rpc GetState (DeviceRef) returns (DeviceStateMessage);
  rpc StreamEvents (StreamEventsRequest) returns (stream DeviceEventMessage);
  rpc DisposeDevice (DeviceRef) returns (DisposeResponse);

  // The inputs/sources a device can switch to, asked at the moment the user picks one. Devices that
  // know their real list (an AV receiver with renamed sources) answer live; others report unsupported
  // and the hub falls back to the device type's declared input capabilities.
  rpc ListInputs (DeviceRef) returns (InputListMessage);

  // The TV guide — a source's channels and their programmes over a time window, for the guide grid. A
  // driver that aggregates EPG (a tuner's cloud guide, an XMLTV feed, an Xtream account) answers; the
  // window keeps a multi-day guide from crossing the wire all at once.
  rpc GetEpg (EpgRequest) returns (EpgMessage);

  // The apps a device can launch — Netflix, YouTube, a TV's own tuner app. A streamer that knows its
  // installed set (Apple TV, Roku, an LG webOS TV) answers live, artwork and all; a device that can't be
  // asked reports unsupported and the hub falls back to whatever apps the driver declares statically.
  rpc ListApps (DeviceRef) returns (AppListMessage);

  // The remote this one unit deserves, asked of the device rather than of the type. A driver knows what
  // Describe cannot: which sources this receiver actually has and what its owner renamed them to, whether
  // this Roku is a TV with volume keys or a stick without. Answering is optional and most devices don't —
  // a lamp has no remote worth drawing — and a driver built before this rpc existed answers UNIMPLEMENTED,
  // which the hub reads as the same "no" and falls back exactly as it did before.
  rpc GetRemote (DeviceRef) returns (DeviceRemoteMessage);

  // What sits behind a bridge — the bulbs on a Hue bridge, the entities on a Home Assistant server.
  // The hub offers to add each as a device of its own, all sharing the bridge's one connection.
  rpc ListBridgedDevices (DeviceRef) returns (BridgedDeviceListMessage);

  // The values a parameter will accept, asked at the moment someone's choosing one. For lists that can
  // only be known by asking the device; fixed lists ride along in the field's own options.
  rpc ListOptions (OptionsRequest) returns (OptionsListMessage);

  // Content navigation (docs/navigation-spec.md). All no-ops on drivers without SupportsNavigation.
  rpc Browse      (BrowseRequest)      returns (NodeListingMessage);
  rpc GetNode     (NodeRefMessage)     returns (LibraryNodeMessage);
  rpc SearchNodes (SearchNodesRequest) returns (NodeListingMessage);
  rpc InvokeItem  (InvokeItemRequest)  returns (ExecuteCommandResponse);

  // Diagnostics: capture the driver's actual conversation with the device — the wire exchange the hub
  // otherwise never sees — for when a driver doesn't work on hardware its author can't test against. Off
  // by default: it's costly and it sees whatever crosses the wire, so the hub turns it on for a device,
  // the user reproduces the problem, and the hub pulls the buffer. Redaction happens in the driver, at the
  // source, so a secret never reaches the hub in the first place. Pull, not stream: the buffer is drained
  // on demand for a bundle and polled for the live view, which needs no long-lived stream to keep alive.
  rpc SetDiagnostics (SetDiagnosticsRequest) returns (SetDiagnosticsResponse);
  rpc GetDiagnostics (GetDiagnosticsRequest) returns (DiagnosticsMessage);

  // Run one of the tools this driver declared in `assistant_tools` — the other half of that declaration,
  // and the point at which a plugin's code runs because a model asked it to.
  //
  // Not on a device: a tool belongs to the driver. `AssistantToolDescriptor` is on `DriverDescriptor` and
  // not on any device, and the hub has no device to name when a model calls one.
  //
  // A driver that declares no tools is never called here. One that declares tools and does not implement
  // this answers UNIMPLEMENTED, the same "no" `GetRemote` gets above — and the hub turns it into a
  // sentence saying the plugin declared the tool and cannot run it, which is more use than a stack trace.
  rpc InvokeAssistantTool (AssistantToolCallRequest) returns (AssistantToolResultMessage);

  // Hand this plugin the settings one person has saved for it — the other half of `settings_schema`, and
  // the only rpc on this contract that names a human being.
  //
  // **Pushed, never pulled, and that is forced rather than chosen.** The hub is the gRPC client and a
  // plugin is the server, so a plugin has no way to ask; the hub therefore tells it. It tells it on every
  // start, for every person who has saved anything, before any device is created — the same replay
  // `CreateDevice` gets, for the same reason: a plugin restarted by a crash must come back configured the
  // way it was, and a plugin that had to be reconfigured by hand after a restart is not a plugin anybody
  // would install.
  //
  // **Not on a device, and not per call.** Settings belong to the plugin the way `assistant_tools` do.
  // Nothing else on this contract carries an identity and nothing else is going to: a tool call still
  // arrives with no principal, because the hub's own AI layer has never had one either.
  //
  // A driver that declares no `settings_schema` is never called here. One that declares a schema and does
  // not implement this answers UNIMPLEMENTED, the same "no" `GetRemote` gets above — the hub keeps the
  // values, says so on the plugin's page, and does not treat it as a fault.
  rpc ApplyPluginSettings (PluginSettingsMessage) returns (PluginSettingsAck);
}

// What the hub says about itself when it asks a driver who it is. The other half of negotiation, and the
// half that was missing: every guard the hub had protected *it* from an old driver, while a driver built
// against a newer contract than the hub understands had no way to find out — proto3 drops unknown fields
// in silence, so it simply lost them.
message DescribeRequest {
  // The highest `Protocol` value this hub knows. 0 means a hub older than negotiation.
  //
  // A driver may use it to leave out anything the hub cannot read, or to log a line its author will
  // understand. **It must still answer** — refusing is the hub's job, because the hub is the party with a
  // screen to explain it on. A driver that throws here is a driver that never gets named in the message a
  // person actually reads.
  uint32 hub_protocol = 1;
}

message DriverDescriptor {
  string type_id = 1;          // stable id, e.g. "http"
  string display_name = 2;
  string description = 3;
  repeated ConfigField config_schema = 4;   // config needed to create a device instance
  repeated CommandDescriptor commands = 5;   // commands common to every device of this type
  repeated EventDescriptor events = 6;       // the events devices of this type emit
  repeated StateField state_schema = 7;      // the state keys devices of this type keep
  repeated string discovery_services = 8;    // mDNS service types this device type advertises as
  bool supports_navigation = 9;              // devices expose a browsable content library (INavigableDevice)
  repeated RemoteTemplateMessage remote_templates = 10;  // remotes this driver ships for its devices
  repeated string traits = 11;      // what this type is for (ir.emitter, bridge, display…)
  bool supports_epg = 12;           // devices provide a TV guide — channels + timed programmes (IEpgSource)

  // Devices of this type may answer GetRemote. A hint, not a promise — an individual device can still say
  // no. It exists so a page listing thirty devices can tell which cards open a remote without thirty gRPC
  // round trips on every redraw; the call itself only happens when someone actually taps one.
  //
  // Superseded by `capabilities` ("device-remotes"), and still sent: see that field.
  bool supports_device_remotes = 13;

  // The highest `Protocol` value this driver was built against. 0 means a driver older than negotiation,
  // which is every driver that exists on the day this ships and is a perfectly good answer.
  //
  // This is the same integer the registry manifest calls `abi`. It is deliberately one number in both
  // places: the manifest's job is to refuse an install before 15 MB is downloaded, this one's job is to
  // refuse a launch, and two integers that could disagree would mean a plugin that installs and will not
  // run — or worse, runs having claimed it would not.
  uint32 protocol_version = 14;

  // The *oldest* hub this driver will work against, when that is lower than `protocol_version`.
  //
  // **Unset does not mean zero — it means `protocol_version`.** Explicit presence, so the two are
  // distinguishable, because the difference is the whole compatibility story: a plugin that says nothing
  // is read as needing a hub at least as new as the contract it was built from, which is the safe
  // reading, and a plugin that later discovers it only ever used version-1 features can declare a lower
  // floor and *widen* what it runs on. A declared floor can only ever widen; that is why the registry
  // manifest carries one integer today and stays true when this one arrives.
  optional uint32 min_hub_protocol = 15;

  // What this driver's devices can do, declared rather than discovered.
  //
  // **Why declaring beats calling.** Without this the hub learns what a driver implements by making the
  // call and reading the answer, and the answer is a `bool supported` that means three different things —
  // "not that kind of device", "not implemented", and "it threw". `Availability` below fixes the answer;
  // this fixes the question, by making the structural half knowable before anything is called.
  //
  // The vocabulary, which is exactly the set of optional behaviours the hub asks about:
  //
  //   "inputs"          — devices answer ListInputs with a real source list
  //   "epg"             — devices answer GetEpg (supersedes supports_epg)
  //   "apps"            — devices answer ListApps
  //   "device-remotes"  — devices answer GetRemote (supersedes supports_device_remotes)
  //   "bridge"          — devices answer ListBridgedDevices
  //   "options"         — devices answer ListOptions for a config field's options_key
  //   "navigation"      — devices answer Browse/GetNode/SearchNodes/InvokeItem (supersedes
  //                       supports_navigation); see docs/navigation-spec.md
  //   "diagnostics"     — the driver answers SetDiagnostics/GetDiagnostics with real captured traffic
  //   "settings"        — the driver answers ApplyPluginSettings for the fields it declared in
  //                       `settings_schema`. Unlike the others this one is about the *driver*, not its
  //                       devices — and a driver may declare a schema without declaring this, which the
  //                       hub reads as "keep my settings and don't bother telling me": the form works, the
  //                       values are stored, and nothing is pushed.
  //
  // An unknown string is ignored rather than an error — that is rule 4 above, and it is what lets a later
  // hub name a capability this driver has never heard of without breaking it.
  //
  // **Reading rule.** An empty list is not "this driver does nothing": it is a driver older than this
  // field, and the hub falls back to the three booleans. A non-empty list is authoritative, and a driver
  // sending one must include every capability it has — including the three the booleans cover, which the
  // SDK folds in for you. The booleans keep being sent so an older hub is unaffected.
  //
  // Declaring a capability whose rpc is not implemented is a bug in the plugin, not in the hub: the hub
  // will call, and NavigationService has no catch at all around Browse and SearchNodes, so the user gets
  // an error rather than a graceful degrade. Declare what you implement.
  repeated string capabilities = 16;

  // The kinds of thing this driver's libraries hold that the hub has never heard of — a recipe, a comic,
  // an audiobook. See MediaTypeMessage and docs/navigation-spec.md §1.4.1.
  //
  // On the descriptor rather than on each node, for the same reason remote_templates is: the hub caches a
  // descriptor and can therefore describe a library whose plugin is not running, and a type repeated on
  // sixty nodes a page would still be undiscoverable until somebody had already browsed to one.
  repeated MediaTypeMessage media_types = 17;

  // Tools this driver offers the assistant — see AssistantToolDescriptor, which is where the reasoning is.
  //
  // On the descriptor, and that costs one re-introspection on the release that carries it: the hub hashes
  // DriverDescriptor and everything it nests to decide whether a cached descriptor is still readable, so a
  // new nested message discards every cached one. Paid deliberately, for the same reason media_types paid
  // it — the alternative is that the assistant's catalogue is empty until every plugin has been started,
  // which would make the tools a plugin offers depend on what somebody happened to open first.
  repeated AssistantToolDescriptor assistant_tools = 18;

  // Settings that belong to **this plugin** rather than to any device it makes — an account to sign in to,
  // a unit preference, a folder to watch. Same `ConfigField` grammar as `config_schema`, and a different
  // thing entirely: `config_schema` is what the hub has to know to *create a device*, and a plugin with no
  // devices at all can still have something worth configuring.
  //
  // **Per person, and that is the whole shape of it.** The hub stores one dictionary per (person, plugin)
  // and hands it back on `ApplyPluginSettings`, so two people on one hub configure the same plugin
  // differently and neither sees the other's answers. If your plugin has one answer for the whole house,
  // say so in your `help` text — the hub cannot tell, and it will still keep a copy per person.
  //
  // **What the hub does with the declaration**, which is exactly what it does with a device's:
  // `required` is drawn and not enforced, `options` and `min`/`max` are enforced on save, `show_when`
  // hides a field, `sensitivity` decides whether a value is ever rendered back. Two do less here than
  // they do on a device and it is worth knowing which: `options_key` is **not** fetched, because the rpc
  // that answers it takes a device id and there is no device; and the hardware selectors (`serial`,
  // `input`, `lirc`, `audio.in`) draw as plain boxes, for the same reason — they are a picker over what is
  // plugged into a hub, resolved against a device that does not exist here.
  //
  // On the descriptor rather than asked for, like `media_types` and `assistant_tools`, so somebody can see
  // and fill in a plugin's settings with its process stopped.
  repeated ConfigField settings_schema = 19;
}

// A media type a plugin invents, declared so the hub can route it and draw it.
//
// **`plays_as` is the field that does the work, and the rest is decoration.** MediaPlaybackInfo.kinds is an
// allow-list on the *destination* side: a Kodi box names ten kinds it will accept and refuses everything
// else, and no plugin can change what that box declares. So before this message existed, the better
// declared a house's players were, the harder an invented kind failed — a `recipe` leaf reached the
// destination list and came back empty, and the Library page drew a playable item with no buttons on it.
// `plays_as: "video"` says "route mine the way you route one of yours", and every existing destination
// keeps working untouched.
//
// The vocabulary split this creates is deliberate and is the honest cost. `kind` stays open: anything may
// appear there, this message only says what the open value *means*. NavKind — the closed set in the SDK —
// stops being the vocabulary and becomes the **routing** vocabulary, the one MediaPlaybackInfo.kinds and
// the hub's activity screens are written against. `plays_as` is the seam between the two, and it is the one
// field here the hub validates: a value outside NavKind names a route nothing can take, so the hub drops it
// and logs, leaving the type browsable exactly as an undeclared one is today.
//
// A declaration may **invent** a kind and may not **redefine** one. Sending `kind: "movie"` is refused
// whole, because the routing vocabulary is what every device's accept-list was written against and a
// plugin repainting it would change where films go in a house it was never installed to touch.
message MediaTypeMessage {
  // The string that appears in LibraryNodeMessage.kind. Required; a type that names nothing matches
  // nothing. Must not be one of NavKind's own values — see above.
  string kind = 1;

  // What to call one of these on screen, e.g. "Recipe". Blank falls back to the title-cased kind, which is
  // what the hub does for an undeclared kind and is wrong for exactly the cases a label is for
  // ("Channel-list").
  string label = 2;
  string label_plural = 3;

  // A Glyph spec — `ti:<name>` for one of the console's bundled Tabler icons. Passed through verbatim, so
  // an unrecognised spec draws as literal text: a visibly wrong icon beats a silently empty one, which is
  // the same reasoning as RemoteTemplateMessage.icon. Blank falls back to the folder glyph.
  string icon = 4;

  // poster | wide | square | banner — the shape a card of this kind is drawn at when neither the item nor
  // the page said. Blank falls back to poster, which is a 2:3 film card and is wrong for most new types.
  string shape = 5;

  // An existing NavKind this routes like: "video", "track", "photo". Blank means this type is not
  // playable, which is a real answer — a `book` a plugin cannot hand out a URL for should say so rather
  // than offer a Play button that fails.
  string plays_as = 6;

  // The metadata keys this type carries, as a display schema. ConfigField rather than a new grammar
  // because it already says key, label, type, options, show_when and — the one that earns its place —
  // `advanced`, which maps exactly onto "show this in the detail sheet, not as a chip".
  //
  // These are shown *alongside* the handful the console already knows how to draw (year, runtime, rating,
  // genres), and a key declared here replaces the console's own version of it rather than doubling it. So
  // declaring nothing loses nothing, which is what lets a type declare a label and an icon and stop.
  //
  // Keys not listed here are still carried in LibraryNodeMessage.metadata and are still dropped by the UI,
  // exactly as they are today. This is what a type shows, not what it may send. Values are shown as sent —
  // metadata is a string map, so a driver that wants "45 min" rather than "2700" sends "45 min", in a key
  // of its own. The console only reformats keys it defined the meaning of, `runtimeSeconds` being the one
  // that matters.
  repeated ConfigField facts = 7;
}

// Why an optional answer is not an answer. Carried alongside `supported` on every rpc that has one.
//
// **This exists because one boolean was carrying three facts.** `supported = false` was returned when the
// hub asked about a device the driver does not hold, when the device is simply not that kind of thing, and
// when reaching the hardware threw — three situations with nothing in common except that the caller could
// not tell them apart. The one place anybody noticed was ListBridgedDevices, which answers `supported =
// true` on a throw with the comment "an unreachable bridge shouldn't read as 'this isn't a bridge'". That
// comment was the bug report for the other five.
//
// **`supported` keeps its old meaning and is still sent.** A reader that has never heard of this enum
// behaves exactly as before — which is why this could be added at all. When both are present this one
// wins, because it is the one that can tell the three apart.
enum Availability {
  AVAILABILITY_UNSPECIFIED = 0;    // nothing said; read `supported` on its own, as before

  AVAILABILITY_ANSWERED = 1;       // asked and answered. An empty list here is a real, empty answer.

  // This device is not that kind of thing, and never will be. Permanent — a lamp has no TV guide. The
  // hub may cache this and stop asking.
  AVAILABILITY_UNSUPPORTED = 2;

  // It is that kind of thing and could not answer just now — the hardware was unreachable, the request
  // timed out, the call threw. **Transient.** Nothing about the device's shape has been learned, so
  // asking again later is the right move and drawing "this has no apps" is not.
  AVAILABILITY_UNAVAILABLE = 3;

  // This driver does not hold that device id at all. Not a statement about the device's abilities: it is
  // a statement that the hub and the driver disagree about what exists, which usually means the driver
  // restarted and the device was never re-created. Worth a line in a log; never worth caching as a "no".
  AVAILABILITY_UNKNOWN_DEVICE = 4;
}

// ---- Driver-supplied remote templates ----
// A driver can ship the remote its devices deserve. Layout is in design-surface pixels on a
// width×height canvas; buttons bind to canonical capability ids, so the hub resolves each to that
// device's real command. Contributed templates join the built-in gallery and are offered when a
// device of this type is added.
message RemoteTemplateMessage {
  string id = 1;               // stable, e.g. "acme.tv.classic"; blank = derived from the driver + name
  string name = 2;
  string description = 3;
  string icon = 4;
  string category = 5;         // gallery grouping, e.g. "TVs"
  string brand = 6;
  int32 width = 7;
  int32 height = 8;
  repeated RemoteElementMessage elements = 9;
}

message RemoteElementMessage {
  string kind = 1;             // button | label | dpad | rocker
  string shape = 2;            // rounded | pill | circle
  double x = 3;
  double y = 4;
  double w = 5;
  double h = 6;
  string capability = 7;       // canonical command id, e.g. "power.toggle" (button)
  string label = 8;            // overrides the vocabulary label; also the label element's text
  string icon = 9;             // overrides the vocabulary icon
  string fill = 10;            // optional colour override
  string variant = 11;         // dpad: cross | ring | round | disc
  string plus = 12;            // rocker: capability for +
  string minus = 13;           // rocker: capability for −

  // Arguments the capability is sent with — `input.select` + {input: "GAME"} is one source key on a
  // receiver. Without these a per-device remote could only draw the dozen sources the vocabulary happens
  // to name discretely, which is not the set any real receiver has.
  map<string, string> args = 14;

  // Type size in px; 0 leaves the default. Needed wherever a real name is longer than the key it sits on —
  // "Cable / Satellite" on a source key — because the face CSS is nowrap + overflow:hidden and cuts the
  // label off mid-word rather than wrapping or shrinking.
  double font_size = 15;
}

// The remote a driver draws for one device, or its refusal to.
message DeviceRemoteMessage {
  bool supported = 1;          // false = this device has no remote of its own; the hub falls back
  RemoteTemplateMessage remote = 2;
  Availability availability = 3;   // which kind of "no" — see Availability
}

// ---- Inputs ----

message InputListMessage {
  bool supported = 1;                        // false = this device doesn't enumerate its inputs
  repeated InputSourceMessage inputs = 2;
  Availability availability = 3;             // which kind of "no" — see Availability
}

message InputSourceMessage {
  string id = 1;               // the value the input command takes, e.g. "MPLAY"
  string label = 2;            // friendly name, e.g. "Media Player"
  string detail = 3;           // optional extra, e.g. a user-assigned rename
  bool current = 4;            // the device reports this as the active input
}

// ---- EPG (TV guide) ----

message EpgRequest {
  string device_id = 1;
  int64 from_unix = 2;         // window start, unix seconds
  int64 to_unix = 3;           // window end, unix seconds
}

message EpgMessage {
  bool supported = 1;          // false = this device isn't a guide source
  repeated EpgChannelMessage channels = 2;
  repeated EpgProgrammeMessage programmes = 3;
  Availability availability = 4;   // which kind of "no" — see Availability
}

message EpgChannelMessage {
  string id = 1;               // channel id programmes reference
  string name = 2;
  string logo = 3;             // channel artwork URL, optional
  string number = 4;           // display number, e.g. "3.1", optional
  string stream_url = 5;       // what to play to watch it, optional — the guide's Watch action uses it
}

message EpgProgrammeMessage {
  string channel_id = 1;
  int64 start_unix = 2;
  int64 stop_unix = 3;
  string title = 4;
  string subtitle = 5;         // episode title, optional
  string description = 6;
  string category = 7;         // genre, optional
  string image = 8;            // programme artwork URL, optional
  string episode = 9;          // "S3E4" or similar, optional
  bool is_new = 10;            // first-run rather than a repeat
}

// ---- Apps ----

message AppListMessage {
  bool supported = 1;                        // false = this device doesn't enumerate its apps
  repeated AppMessage apps = 2;
  Availability availability = 3;             // which kind of "no" — see Availability
}

message AppMessage {
  string id = 1;               // the value the launch command takes — a Roku channel id, an app bundle id
  string name = 2;             // friendly name, e.g. "Netflix"
  string icon = 3;             // optional artwork URL for the app's logo
  string detail = 4;           // optional extra, e.g. a version or category
  bool current = 5;            // the device reports this app as in the foreground
  repeated AppParamMessage params = 6;   // what this app can be handed at launch — a stream URL, say. Usually empty.
}

// A value an app accepts when launched — the answer to "can this one be passed a stream to play?". Sent
// alongside the app id through the same launch command.
message AppParamMessage {
  string key = 1;              // the launch command argument this fills
  string label = 2;            // what to show the user, e.g. "Stream URL"
  string kind = 3;             // a UI hint: "url" | "text"
  bool required = 4;           // whether the app can be launched without it
}

message OptionsRequest {
  string device_id = 1;
  string options_key = 2;      // whatever the parameter declared
}

message OptionsListMessage {
  bool supported = 1;          // false = this device doesn't answer for that key
  repeated FieldOptionMessage options = 2;
  Availability availability = 3;   // which kind of "no" — see Availability
}

message BridgedDeviceListMessage {
  bool supported = 1;                        // false = this device doesn't front anything
  repeated BridgedDeviceMessage devices = 2;
  Availability availability = 3;             // which kind of "no" — see Availability
}

message BridgedDeviceMessage {
  string id = 1;               // the bridge's own id for it, stable across restarts
  string name = 2;
  string kind = 3;             // light | switch | media | sensor | scene | speaker | tv
  string detail = 4;
  map<string, string> config = 5;   // extra config to stamp on the device created for it
}

message EventDescriptor {
  string type = 1;             // e.g. "playback.started"
  string description = 2;
  repeated EventField fields = 3;
  bool has_extra_data = 4;     // event may carry extra raw keys beyond the declared fields
}

message EventField {
  string key = 1;
  string type = 2;             // string | number | bool
  string description = 3;
}

message StateField {
  string key = 1;
  string type = 2;
  string description = 3;
}

// A question a form asks, in four places: a device type's config_schema, a command's parameters, an
// assistant tool's parameters, and a media type's facts.
//
// **Which of these the hub enforces, and where.** Until recently the honest answer was "none of them" and
// this file said nothing either way, which left a plugin author to infer a boundary from a form. It is
// written down per field below, and the shape is worth stating once here because it is not symmetric:
//
//   • Enforcement applies to a **device type's config_schema and to nothing else.** A CommandDescriptor
//     or AssistantToolDescriptor parameter is drawn from its declaration and never checked against it, so
//     a command argument's `min` really is advisory. Do not read a rule below as covering all four.
//   • Where it applies, it applies to **every writer** — the console's forms, POST /api/devices and
//     PUT /api/devices/{id} — because the check is in the device registry rather than in a form. A
//     refusal is a 400 carrying one sentence built from what you declared, and the field is named by its
//     `label`, or by its `key` if the label is empty. **Declare a label you would be content to read in
//     an error message.**
//   • A refusal happens **before CreateDevice**. Nothing is stored, your driver is not called, and there
//     is no partial write for a plugin to observe or undo.
//   • Only a value that **changed** is judged, against what is already stored, and an emptied value is
//     not judged at all. So narrowing a bound in a new version of your plugin does not make the devices
//     somebody already has uneditable — it refuses the next edit that keeps the value out of range.
//   • A field whose `show_when` is not satisfied is not judged, and neither is a key your schema never
//     mentioned: transports, presets, pairing and address repair all write into the same dictionary.
message ConfigField {
  string key = 1;
  string label = 2;
  string type = 3;             // string | number | bool | secret | multiline
  // Drawn — an asterisk on the form — and **not enforced**: the hub will store a device with this field
  // empty or absent.
  //
  // That asymmetry is deliberate rather than unfinished, and it is the one place in this message where a
  // declaration means less than it sounds like. In practice the flag is used to mean "star this on the
  // form" rather than "refuse the device without it", and refusing on it would overrule a driver about
  // its own device: a driver may reasonably mark two fields required because either one is enough on its
  // own — one to wake a console, the other to navigate it — and a device added to be woken and not
  // navigated legitimately carries only one. **So do not read this as a promise that you will be handed
  // a value.** If your driver cannot start without one, check for it in CreateDevice and fail with a
  // sentence naming the field.
  bool required = 4;
  string default_value = 5;
  string help = 6;

  // The values this field accepts, when they're known up front.
  //
  // **Enforced on a device's config**, unless options_key is also set: a submitted value that is not one
  // of these is refused, and the sentence the caller gets names the values that were offered. The form
  // still draws a chooser with an escape to free text, and that escape does not widen what is accepted —
  // it exists so somebody can type a value you *did* offer under a label they cannot see.
  repeated FieldOptionMessage options = 7;
  // For a list only the device can answer — the hub asks via ListOptions with this key.
  //
  // **Not enforced, and it suppresses the options check above.** The hub does not hold this list when a
  // write arrives and will not call your driver mid-save to find out, so a field carrying both a key and
  // a static list is treated as the key's: the static list is the hint you already said was incomplete.
  string options_key = 8;
  // Range for a number field. Strings so "unset" is distinguishable from zero.
  //
  // **Both are enforced on a device's config**, independently: declare one end and only that end is
  // checked, and the sentence the caller gets names the end that was crossed rather than inventing the
  // other. A value that is not a number at all is refused here too. Declaring both also picks a slider
  // for the form, which is a separate thing from the check and needs both to be meaningful.
  string min = 9;
  string max = 10;

  // A good default most people shouldn't touch — folded away behind "Advanced".
  bool advanced = 11;
  // Filled by a flow rather than by hand — pairing, a bridge picker, the remote editor. Never one of the
  // questions a form asks: an add-device form leaves it out, and an edit form that keeps it (so a value
  // that has gone wrong can be put right) shows it in a collapsed group named for whoever wrote it.
  bool managed = 12;

  // "Only ask for this when another field is set to one of these": "transport=serial|network".
  // A driver with several ways to reach the same hardware has fields that only apply to one of them,
  // and showing all of them at once asks people to know which four of the seven boxes to ignore.
  string show_when = 13;

  // How careful the hub has to be with this field's *value* — see Sensitivity.
  //
  // **Declared, rather than guessed from the key or the widget.** Until this field existed the hub decided
  // by looking at the type string and, failing that, at whether the key contained one of a list of words —
  // and there are five such lists in the product, which do not agree with each other. The one that decides
  // whether a box is masked has no bare "key" and no bare "pass", so a field named `clientKey` declared as
  // `string` rendered as ordinary visible text while another panel one click away masked the same value.
  //
  // A survey of every comparable system found the same failure in each of them: Homebridge has no password
  // type at all, so `"format": "password"` silently produces a plain text box; Home Assistant masks on a
  // substring of the field's *name*, so `api_key` renders in the clear. Treating "secret" as a widget is
  // the design that failed everywhere it was tried. This is the classification, and `type` stays the
  // widget — the two are orthogonal, which is Terraform's split and Sonarr's.
  //
  // **Unset is not "normal".** It means the plugin did not say, and the hub falls back to exactly what it
  // did before: the `type` string, then the heuristics. Saying nothing therefore costs a plugin nothing and
  // gains it nothing, which is what makes this safe to add to a contract that is already in the field.
  Sensitivity sensitivity = 14;
}

// What the hub must do with a field's value, as distinct from what the form draws for it.
//
// Two levels rather than a boolean, because "don't show it on a screen" and "don't keep it at all" are
// different requirements and every system that collapsed them got one of the two wrong. Terraform carries
// exactly this split as `sensitive` versus `write_only`; Backstage carries a three-valued `visibility` and
// defaults it to the closed end for the same reason.
enum Sensitivity {
  // The plugin did not say. The hub reads `type` and its own heuristics, exactly as it did before this
  // field existed — so an old plugin and a plugin that declines to declare are treated identically.
  SENSITIVITY_UNSPECIFIED = 0;

  // An ordinary value. Say this to positively opt *out* of the heuristics: a field genuinely called
  // `publicKey` or `passenger_count` is not a credential, and the word lists cannot tell.
  SENSITIVITY_NORMAL = 1;

  // A credential. Never rendered into a page, never printed in a log, trace or diagnostic bundle — and
  // still stored, because the hub has to be able to reconnect without asking a person again. Stored
  // encrypted, with a key bound to the one hub: see SENSITIVITY_WRITE_ONLY, which is the same at-rest
  // treatment and a different promise about being read back.
  //
  // "Never rendered" is stronger than "rendered as dots" and the difference is the whole point: this hub's
  // console is Blazor Server, so a value written into an input's `value=` attribute crosses the circuit to
  // the browser whether or not the glyphs are masked. What the hub sends instead is *whether* something is
  // stored — Grafana's `secureJsonFields` shape — with an explicit button to remove it, because a box that
  // starts empty can no longer say "clear this" by being emptied.
  SENSITIVITY_SENSITIVE = 2;

  // A credential the hub must hold as tightly as it can: a pairing PIN, a one-time code, a token the
  // plugin exchanges for something else at startup.
  //
  // **This comment used to say the value is not written to storage and is not in a backup bundle. That was
  // never true, and it is not true now.** Nothing read this field on any write path, so a WRITE_ONLY value
  // was withheld from a form and from an API response exactly as SENSITIVE is and then stored beside it in
  // the clear. What is implemented as of this commit is the closest honest thing: the hub encrypts it at
  // rest with a key bound to that one hub and kept out of its own backups, so the database file and the
  // bundle carry ciphertext that only the machine that wrote it can open. It **is** written to storage, it
  // **does** survive a restart, and it **is** in a backup bundle — sealed.
  //
  // Literal deletion was considered and refused, not skipped. A hub rebuilds a driver's device by replaying
  // its stored config into CreateDevice on every start, every driver restart and every crash-restart of the
  // driver process — not only when a person adds one. A field that is genuinely absent from storage is
  // absent from all of those, so honouring the word "not kept" needs a way for a driver to ask a person for
  // the value again, which is a protocol addition rather than a storage rule. Until that exists, do not
  // write a plugin that relies on this value being gone.
  //
  // What you may rely on, stated as narrowly as it deserves: the value is not readable in the hub's
  // database, and a backup restored onto different hardware cannot decrypt it — so the device arrives there
  // configured in every other respect with this field blank, and somebody has to enter it again. That last
  // part is the cost, and it is the hub's, not the plugin's.
  //
  // Everything a plugin can proceed without still wants SENSITIVE. Choose this one to say the value is
  // single-use and should never be shown, read back, or carried to another machine.
  SENSITIVITY_WRITE_ONLY = 3;
}

message FieldOptionMessage {
  string value = 1;            // what gets sent
  string label = 2;            // what the user reads
  string detail = 3;
  bool current = 4;            // the device reports it's on this one now
}

message CommandDescriptor {
  string id = 1;
  string label = 2;
  string description = 3;
  repeated ConfigField parameters = 4;
}

// A tool this driver offers the assistant, and — the part that matters — *who is allowed to reach it*.
//
// ---- Why the scope travels with the tool ---------------------------------------------------------------
//
// The hub's own assistant already had this problem and solved it once, for itself. Three commands take a
// free string and send it at the hardware — `system.send_raw`, `text.input`, `avr.zone_select` — and
// `do(<hid proxy>, "system.send_raw", "UNPAIR all")` drops every Bluetooth bond a proxy holds: reachable by
// a Viewer, sayable out loud, unconfirmed, and undone only by walking to the far end and pairing everything
// again. Nobody had written a hostile plugin; that was the product's own code. The hazard was never that
// the author was hostile, it was that **nobody was looking at the moment it ran**.
//
// The fix then was to take those three off the *remote* and keep them on the *console* — Admin or Operator,
// typed, on a screen, with somebody looking — and it was implemented as a deny-list of three names. That
// works because the set of capability strings is closed and the hub writes all of them.
//
// **A deny-list cannot close an open namespace.** The moment a plugin may name its own tools there is no
// list of three, or three hundred, that covers `acme.send_raw`; the hub cannot inspect a tool to find out
// what it does, because a tool is a name, a description and a schema, and the doing is on the far side of a
// gRPC call. So the scope has to arrive *with* the tool, declared by the only party that knows.
//
// ---- The rule ------------------------------------------------------------------------------------------
//
// **A tool that acts works on `console` by default. The remote — anything spoken, and the handset — is
// opt-in, per tool.** The opt-in is not a separate flag: it is naming "remote" in `surfaces` beside
// `acts: true`, and the hub's job is to make that combination *visible* rather than to refuse it. The
// plugin's own page says, in words, which of its tools anybody speaking in the house can trigger.
//
// Three properties that shape buys, and each is the reason not to add a fourth field:
//   * it cannot drift out of step with the surface list, because it *is* the surface list;
//   * it is one concept to learn, in any language — an SDK may make the default pleasant, but the rule does
//     not live in an SDK, because a Python or Go plugin has to express it as easily as a C# one;
//   * the dangerous combination is legible in the descriptor, so a console can enumerate it, a test can
//     count it, and somebody reviewing a manifest can see it without running anything.
message AssistantToolDescriptor {
  // Your name for it, bare: "scene_report", not "acme.scene_report". **The hub namespaces it** as
  // `<type_id>.<id>` and there is no way to opt out of that.
  //
  // Not politeness. The assistant's catalogue is one flat list of names and its dispatcher is a switch over
  // them, so a plugin free to call a tool `do` would put two tools of that name in front of the model with
  // undefined behaviour, and the call would land on the built-in arm. Namespacing is what makes a plugin's
  // tools additive instead of a collision waiting for the right name.
  string id = 1;

  // What a person reads on the plugin's page. Never sent to a model.
  string label = 2;

  // What the model reads, and it is a prompt.
  //
  // Not a caption: a description is the one piece of text a model is *meant* to act on, and it rides in
  // every request on every surface the tool is offered on — not once, in a result, but before anybody has
  // said anything. Twenty plugins at five hundred characters each doubles the system prompt on every spoken
  // turn. So there is a ceiling, per tool and per plugin, and the hub says the number when it refuses.
  //
  // The realistic failure here is not a hostile plugin and the ceiling is not a security control. It is an
  // author writing "always call this first" and degrading every conversation on the hub — which without the
  // plugin's name attached to it is unattributable, and that is the thing being fixed.
  string description = 3;

  // The tool's arguments, as ConfigFields rather than as a JSON Schema string.
  //
  // Refusing raw JSON Schema is deliberate, and none of the three reasons is about trust. It goes to the
  // model vendor verbatim, so a malformed one fails the *whole turn* for every tool in it with an error
  // nobody can trace back to a plugin. It defeats the descriptor cache's invalidation, which hashes field
  // numbers and names — an opaque string has one field number, so the hash stops moving when the schema
  // language changes. And ConfigField already carries what a tool parameter needs and more: options,
  // options_key, min/max, required, help. CommandDescriptor.parameters is already ConfigField, so this is
  // the established shape rather than a new one; the hub renders them to JSON Schema in one place, which is
  // also the one place it can bound the size and refuse the pathological.
  repeated ConfigField parameters = 4;

  // Which assistant surfaces offer this tool. Slugs from the hub's own prompt catalogue, which is the list
  // a person can open and read:
  //
  //   "remote"           — anything spoken in the house, and the chat on a handset
  //   "console"          — the panel in the web console; Admin or Operator, typed, on a screen
  //   "rules"            — the rule editor's assistant
  //   "activities"       — the activity builder's assistant
  //   "activity-doctor"  — the thing that repairs a running activity
  //
  // **Empty means offered nowhere**, and that is the default. Under a trusted model the argument for it is
  // not safety: a tool offered everywhere makes every prompt longer and every model's choice harder, and
  // that failure is diffuse and lands on somebody else. Silence is the only default whose failure mode is a
  // support question rather than a slow, unattributable degradation.
  //
  // An unrecognised slug is dropped rather than refused — rule 4 at the top of this file — so a plugin
  // written against a hub with a surface this one has never heard of still offers its other tools.
  repeated string surfaces = 5;

  // Whether calling this changes anything: turns something on, writes a setting, sends at hardware. False
  // means it only reads.
  //
  // **A claim, not a guarantee, and it must be presented as one.** Nothing can check it — the doing is on
  // the far side of a gRPC call. It is the same kind of statement as an infrared transport declaring that
  // it can never confirm anything: a fact only the driver knows, which the product uses to describe itself
  // honestly. It gives the console a sentence to print, and it gives the "ask before something disruptive"
  // rule something structural to point at instead of a list of names it can never extend — a prompt cannot
  // name a tool that did not exist when it was written.
  bool acts = 6;
}

// A model asked for one of this driver's declared tools, and the hub has already decided it may.
//
// ---- What the hub has settled before this message is sent ---------------------------------------------
//
// The tool exists, this driver declared it, and it named `surface` in its own `surfaces` list. That last
// one is a **refusal at the call and not a filter on the catalogue**: a model can name a tool it was never
// offered, so the hub re-checks the declaration at the moment of dispatch and answers a refusal instead of
// this message when it does not hold. A driver therefore never receives a call for a surface it did not
// name, and does not have to defend against one.
//
// The arguments have been narrowed to the keys the tool declared. An argument the model invented is
// dropped before it gets here, so `args` is a subset of `parameters` and never a superset.
message AssistantToolCallRequest {
  // Bare, as declared — "scene_report", not "acme.scene_report". The namespace is the hub's and is
  // stripped on the way in, so a driver matches on the id it wrote.
  string tool_id = 1;

  // The model's arguments, flattened to strings the way every other argument on this contract is.
  map<string, string> args = 2;

  // Which assistant asked: one of the `surfaces` slugs. Informational, and deliberately not a thing to
  // check — the hub has already refused anything this tool did not name. It is here because a tool offered
  // on both "console" and "remote" may reasonably answer at different lengths for a screen and for a
  // speaker, and a driver that wants to make that distinction should not have to be told the surface twice.
  string surface = 3;
}

// What the model is told, and it is the only thing the model is told.
//
// `text` is prose for a model rather than a structure for a program — the hub puts it into the tool-result
// message unchanged and does not parse it. Whatever a plugin wants understood has to be in these words.
//
// **This is external data**, on the same footing as a media title or a device's reported state: it is
// written outside the house and outside the model, and the hub treats it as something to read rather than
// something to obey. See `ai-safety.md` §4 and §9.3 for what that does and does not buy.
message AssistantToolResultMessage {
  // False when the tool could not do what was asked. The text still goes to the model — a model that is
  // told *why* something failed can say so or try another way, and one handed a bare failure cannot.
  bool ok = 1;

  // What the model reads. Bounded by the hub, which truncates rather than refusing: a tool that answers
  // with a database is a bug worth surviving, and half an answer is more use to a person standing in a
  // room than an error.
  string text = 2;

  // For the hub's log, and never sent to the model. A driver that fills `error` and leaves `text` empty
  // gets a sentence composed by the hub, so nothing is lost by using this for the technical half.
  string error = 3;
}

// One person's answers to `settings_schema`, and who that person is.
//
// ---- The identity, and what it costs -------------------------------------------------------------------
//
// **This is the only place a person crosses this boundary, and it is deliberate rather than incidental.**
// Before this message existed no field on this contract named a human being — no `user`, no `principal`,
// no `actor`, no `tenant` — and every request was device-scoped. A `(person, plugin)` settings document
// cannot be handed over without a key, so an id had to cross; the display name crossing beside it is a
// second decision, taken on its own, and it is the one worth reading.
//
// It was taken because the alternative is worse. A plugin given an opaque id and a reason to greet
// somebody either cannot, or invents its own id-to-name mapping and asks each person to type their own
// name into it a second time — a second copy of a fact the hub already holds, wrong the first time
// somebody is renamed.
//
// **What it costs, stated because whoever installs a plugin should be able to see what they are agreeing
// to.** A plugin is an ordinary process with the hub's privileges — this product does not sandbox one and
// says so in as many words. So a household's names now reach every installed third-party binary, and that
// binary may log them, keep them, or send them anywhere, and nothing in the product observes it. The hub's
// privacy pages carry this as its own category rather than leaving a reader to work it out.
//
// **Three things this is not**, each cheap now and expensive later:
//   1. The name is a courtesy, never a key. Key anything you store on `user_id`. Somebody will be renamed.
//   2. It is the display name and not the login name. The login half of a credential pair does not cross.
//   3. There is no role, no enabled flag and no last-login here, and there will not be. A plugin that needs
//      to know whether somebody may do something is asking the wrong process.
message PluginSettingsMessage {
  // Stable, opaque, and the only thing here fit to key on. Never blank.
  string user_id = 1;

  // What this person is called, for a plugin to render. May be blank — an account need not have one — and
  // may change at any time without `user_id` moving, which is the entire reason the two are separate.
  string user_display_name = 2;

  // Their answers, keyed as `settings_schema` declared them, flattened to strings the way every other
  // dictionary on this contract is.
  //
  // **A key you declared may be missing, and a key you did not declare may be present.** Missing means
  // nobody has answered it — read your own default rather than an empty string, because the hub does not
  // fill one in. Present-and-unknown means somebody configured this plugin, then updated it to a build
  // that no longer declares that field; the hub keeps what it was given rather than quietly discarding an
  // answer on the strength of a schema that may itself be the stale half.
  //
  // A value a person **cleared** is absent, not blank. The hub replaces this dictionary wholesale on every
  // save for exactly that reason, so removing a setting really does remove it.
  map<string, string> values = 3;
}

message PluginSettingsAck {
  // False when the plugin will not accept these values — a folder that is not there, an account that will
  // not sign in. **The hub has already stored them**, and it stores them either way: refusing to store what
  // somebody typed leaves them with a form they cannot correct and a plugin they cannot reconfigure. What
  // `ok = false` buys is that `error` is shown to the person who pressed Save, next to the fields they
  // filled in.
  bool ok = 1;

  // Why, in words for the person at the form rather than for a log. Empty with `ok = false` gets a
  // sentence composed by the hub, so there is no need to invent one.
  string error = 2;
}

message CreateDeviceRequest {
  string device_id = 1;
  string name = 2;
  map<string, string> config = 3;
}

message CreateDeviceResponse {
  bool ok = 1;
  string error = 2;
  repeated CommandDescriptor commands = 3;   // per-instance commands (may extend the common set)
  repeated string traits = 4;                // what this device is for, when it differs from its driver's
  MediaPlaybackInfo playback = 5;            // what it can be handed to play; absent means it never said
}

// What a device can be given to play, and how.
//
// Declared rather than sniffed. The hub used to look for a command parameter named something like "url",
// which offered a Zidoo reached over RS-232 as somewhere to send a film — a media player that cannot be
// given one — and generated the activity with no play step and no complaint. Per-device because the same
// driver fronts both: the network Zidoo takes a URL, the serial one doesn't.
// An absent message and a present one with an empty command_id are different answers, and the difference
// is load-bearing: absent is "this driver hasn't declared", which leaves the hub sniffing parameter names,
// while present-and-empty is "asked and answered: nothing", which the hub believes. A device with a
// URI-shaped parameter that isn't a media handoff — an Xbox app launcher, a webhook — has no other way out
// of the sniff.
message MediaPlaybackInfo {
  string command_id = 1;      // the command that plays something; empty = nothing can be handed here
  string url_param = 2;       // which of its parameters carries the thing to play
  repeated string kinds = 3;  // movie · episode · track · video · photo · channel · stream; empty = any
}

message ExecuteCommandRequest {
  string device_id = 1;
  string command_id = 2;
  map<string, string> args = 3;              // already token-resolved by the hub
}

message ExecuteCommandResponse {
  bool ok = 1;
  string error = 2;
  map<string, string> result = 3;
}

message DeviceRef { string device_id = 1; }

message StreamEventsRequest {}                // stream events for every device on this driver

message DeviceStateMessage {
  bool online = 1;
  map<string, string> state = 2;

  // A device whose command list isn't known until it has talked to its hardware — a Hubitat child
  // learns what it can do from the hub — sends the list here once it changes. Only when it changes:
  // state is refreshed on every event, and repeating an unchanged list would be pure noise.
  bool commands_changed = 3;
  repeated CommandDescriptor commands = 4;

  // And the same for what the device *is*. A bridge's children all share their driver's type id, so
  // the driver's own traits describe the hub, not the lamp — every child has to say for itself.
  bool traits_changed = 5;
  repeated string traits = 6;
}

message DeviceEventMessage {
  string device_id = 1;
  string type = 2;                            // e.g. "playback.started", "request.sent"
  map<string, string> data = 3;
  int64 timestamp_unix_ms = 4;

  // Set only on a heartbeat frame — `type` == "driver.heartbeat", `device_id` empty, `data` empty. The
  // frame is about the *process*, not about any one device it hosts, which is why the device id is blank.
  //
  // A message field rather than a handful of scalars, and that is the whole point: proto3 gives a scalar a
  // default of 0 that no reader can tell from a real reading, and a 0 for a heap nobody measured is the lie
  // this codebase refuses to draw. A message is either there or it is not. A driver built before this
  // existed emits no heartbeat frame at all, so the hub holds no sample for it and can say "there was never
  // a number to take" — which is a different sentence from "we could not read it".
  DriverRuntimeMessage runtime = 5;

  // Set only on a hold frame — `type` == "driver.hold", `data` empty. Same shape and the same reasoning as
  // `runtime` above: a message is either there or it is not, where a scalar's zero would be a claim.
  DriverHoldMessage hold = 6;
}

// A driver's own account of its runtime, carried on the StreamEvents stream that is already open.
//
// **Deliberately not here: anything /proc already answers.** `#170` reads VmRSS, RssAnon, RssFile, VmSize,
// VmSwap, VmHWM and the OS thread count out of one `/proc/<pid>/status` per process per tick, hub-side, for
// any pid. Sending those again would buy nothing and create a second source for the same fact that could
// disagree with the first. Everything below is a number that only the process itself can know.
//
// **Every field has explicit presence.** Unset means "not taken"; it never means zero.
message DriverRuntimeMessage {
  // GC.GetTotalMemory(false). Valid from the first instruction — measured, this one does *not* wait for a
  // collection the way everything under `gc_index` does.
  optional int64 managed_heap_bytes = 1;

  // GC.GetTotalAllocatedBytes() — allocated over the whole life of the process, monotonic. Sent raw rather
  // than as a rate on purpose: a rate would bake this frame's interval into the number, and the hub already
  // knows when two frames arrived. Differencing two frames hub-side gives bytes/sec, and it is the single
  // most useful number here — it is how you see a driver churning without its heap ever growing.
  optional int64 total_allocated_bytes = 2;

  // GC.CollectionCount(n), monotonic, same differencing.
  optional int32 gen0_collections = 3;
  optional int32 gen1_collections = 4;
  optional int32 gen2_collections = 5;

  // ---- Everything below comes from GCMemoryInfo, and is UNSET until the first collection ----------------
  //
  // Measured on .NET 10, both CoreCLR and Native AOT: before any GC has run, GCMemoryInfo reports
  // HeapSizeBytes, TotalCommittedBytes and FragmentedBytes as literally 0, and Index as 0 along with them.
  // `#151` drew "committed — 0 B" from exactly this. `#170` recorded the trap for TotalCommittedBytes;
  // it is in fact all three, and `gc_index` is what tells "no collection yet" from "a collection that
  // found nothing". The driver leaves all four unset while gc_index would be 0.
  //
  // Also: committed >= live does NOT hold — `#170` saw 31.1 MB live against 21.7 MB committed on a real
  // page, because the two are not read in the same instant. No copy anywhere may call the gap headroom.

  // Which collection the three below describe. Unset means none has happened, so they are unset too.
  optional int64 gc_index = 6;
  optional int64 gc_heap_size_bytes = 7;
  optional int64 committed_bytes = 8;
  optional int64 fragmented_bytes = 9;

  // ---- Thread pool -------------------------------------------------------------------------------------
  // Not the OS thread count — /proc has that, and this is a subset of it. `pending_work_items` is the one
  // worth the wire: a queue that grows is thread-pool starvation, which is invisible from outside the
  // process and is the failure mode a driver blocking on a socket actually produces.
  optional int32 thread_pool_threads = 10;
  optional int64 thread_pool_pending_items = 11;

  // ---- The two facts that make the beat readable -------------------------------------------------------
  //
  // Both live here rather than on the descriptor, and that is deliberate. A descriptor is *cached*, keyed
  // by a stamp taken from one entrypoint file, and a plugin whose entrypoint is a launcher script can
  // change everything behind it without that stamp moving — so a promise about threading served from the
  // descriptor could be a promise the running process no longer keeps. These arrive on the beat itself.
  // They cannot be stale, and they cost eight bytes on a frame that is already going out.

  // How often this driver intends to send this frame. **Without it every hub-side threshold is a constant
  // chosen against one SDK's default.** The hub's is 30 s, which is fifteen of the .NET SDK's 2 s
  // intervals and simply wrong for a plugin that beats once a minute — that plugin would be reported as
  // silent thirty seconds into normal operation.
  //
  // Unset means "did not say" and the hub keeps its own default. Set it. A plugin that beats slowly and
  // does not declare it is a plugin that will be described, accurately and uselessly, as having stopped.
  optional uint32 heartbeat_interval_ms = 12;

  // Whether this beat keeps going while the driver is handling a command.
  //
  // **The protocol asks rather than requires, and the reasoning matters more than the field.** Requiring
  // independence would be one sentence to write and nothing to enforce: a single-threaded plugin — which
  // is the natural shape in most languages, and the population this whole seam exists to admit — would
  // violate it silently, and the hub would read "busy" as "stopped" with no way to know. A rule nobody can
  // check is worse than a fact on the wire, because it licenses the reader to trust something false.
  //
  // So: **independence is a SHOULD, and declaring the truth is a MUST.** Emit the beat from a task, thread
  // or timer that is not the one servicing ExecuteCommand, and set this true. If you cannot — a plugin
  // with one thread and one loop — set it *false*, and the hub will never read your silence as anything at
  // all. False costs you nothing except a liveness signal you were never able to give.
  //
  // **Unset is a third answer, not a synonym for false.** A driver that predates this field made no
  // promise either way, and the hub goes on reading its silence exactly as it did before — collapsing the
  // two would take a working signal away from every driver that has not been rebuilt. `false` is a
  // positive declaration that silence means busy, and it is the one that buys you the protection.
  optional bool heartbeat_independent = 13;
}

// "I am deliberately waiting, and here is until when." The third thing a hub needs before silence or a
// slow call could ever mean anything.
//
// **Why it exists.** The hub can see that a call has been outstanding for ten minutes. It cannot see the
// difference between a driver wedged for ten minutes and a driver waiting, correctly, for somebody to walk
// over and press the pairing button on a bridge. Those two look identical from outside the process and
// only the driver knows which it is — the same argument that put the GC counters on the heartbeat rather
// than in /proc.
//
// Sent as a frame on StreamEvents: `type` == "driver.hold", `hold` set. Like the heartbeat it is about the
// process rather than about a rule, so the hub takes it off the stream and it never reaches the event bus.
message DriverHoldMessage {
  // Stable for the life of one hold, so the frame that ends it names the same one it began. Any string the
  // driver likes; a device id plus a verb is a good one.
  string id = 1;

  // Which device this is about. Empty means the process itself — a driver waiting on a login it needs
  // before any of its devices can work.
  string device_id = 2;

  // One phrase, written for whoever is looking at the screen: "waiting for the button on the bridge".
  // Not an error and not a status code — this is the sentence that replaces "unanswered for 10 min", so it
  // has to say what the wait is *for*.
  string reason = 3;

  // When the driver expects to stop waiting. **0 means it does not know**, which is an honest and common
  // answer — a pairing wait ends when a person acts. A hold with no horizon still says "this is deliberate";
  // it just cannot say for how much longer.
  int64 until_unix_ms = 4;

  // This hold is over. Send one of these for every hold begun, including when the wait failed: a hold that
  // is never released is indistinguishable from the wedge it was meant to explain, which would make this
  // field a way of hiding exactly what it exists to reveal. The hub also drops every hold a driver holds
  // when its process goes, so a crash cannot leave a permanent excuse behind.
  bool released = 5;
}

message DisposeResponse { bool ok = 1; }

// ---- Navigation ----

message BrowseRequest {
  string device_id = 1;
  string node_id = 2;          // empty = library root(s)
  int32 offset = 3;
  int32 limit = 4;
  string sort_by = 5;
  string filter = 6;
}

message NodeRefMessage {
  string device_id = 1;
  string node_id = 2;
}

message SearchNodesRequest {
  string device_id = 1;
  string query = 2;
  int32 offset = 3;
  int32 limit = 4;
}

message InvokeItemRequest {
  string device_id = 1;
  string node_id = 2;

  // Normally one of the ids this node listed in LibraryNodeMessage.commands — your own vocabulary, which
  // only you have to understand.
  //
  // RESERVED IDS. The hub also sends these, and a node never advertises them, so a driver that switches on
  // its own command list will not recognise one. There is exactly one today:
  //
  //   "resolve" — "what is this item, and where does it stream from?" A question. Answer it in
  //   ExecuteCommandResponse.result: at minimum `streamUrl` and `mediaType` for anything playable, plus
  //   `title` and `positionSeconds` where you have them. Then stop.
  //
  //     MUST NOT emit library.play, library.queue, or any other event that routes playback.
  //     MUST NOT start playback anywhere, on the server or on a client.
  //     MUST NOT leave state behind that a second resolve would see differently.
  //
  //   The caller is going to route the answer itself — it starts an activity with it, or hands the URL to a
  //   box in another room. An event announcing the resolve fires every redirect rule the user has written
  //   against this source, and the caller then routes it a second time: one press, two playbacks, the first
  //   one wherever the rule points rather than where the person asked. Two of the three drivers in this
  //   repo did that for months, because this paragraph did not exist.
  //
  //   Do not implement it and the honest failure is a failed CommandResult, which the hub reports as
  //   "couldn't work out how to play that" — the item is unplayable through the hub's routing, and visibly
  //   so. That is the correct answer for a library that cannot hand out a URL.
  //
  // See docs/navigation-spec.md §1.6.1.
  string command_id = 3;
  map<string, string> args = 4;
}

message NodeListingMessage {
  LibraryNodeMessage node = 1;             // the browsed node (may be unset at a root)
  repeated LibraryNodeMessage items = 2;
  int32 total = 3;
  string shape = 4;                        // the page's default item shape (poster | wide | square | banner)
  string size = 5;                         // the page's card size (compact | normal | large)
}

message LibraryNodeMessage {
  string id = 1;
  string parent_id = 2;
  string kind = 3;
  string title = 4;
  string subtitle = 5;
  string overview = 6;
  bool is_container = 7;
  bool is_playable = 8;
  int32 child_count = 9;
  bool has_child_count = 10;               // distinguishes 0 from "unknown"
  map<string, string> metadata = 11;
  repeated ImageRefMessage images = 12;
  repeated ItemCommandMessage commands = 13;
  string shape = 14;                       // this item's shape; blank inherits the page's
  string size = 15;                        // this item's card size; blank inherits the page's
  string group = 16;                       // section heading this item belongs under; blank means ungrouped
}

message ImageRefMessage {
  string kind = 1;
  string url = 2;
  int32 width = 3;
  int32 height = 4;
  string blur_hash = 5;
  string aspect = 6;                       // the shape of this image itself, when known
}

message ItemCommandMessage {
  string id = 1;
  string label = 2;
  string kind = 3;
  repeated ConfigField params = 4;

  // A Glyph spec for this command's button, passed through verbatim like every other icon on this wire.
  // Blank keeps the hub's own drawing, which has a case for `queue` and draws a play triangle for
  // everything else — including `toggle`, `shuffle`, `open`, and every command a plugin invents.
  //
  // Note where this field is: on the node, not on the descriptor, so it costs no descriptor
  // re-introspection. `DriverManifest.Contract()` hashes only what DriverDescriptor can reach.
  string icon = 5;
}

// --- Diagnostics ---------------------------------------------------------------------------------------

message SetDiagnosticsRequest {
  string device_id = 1;   // empty means every device this driver hosts
  bool enabled = 2;

  // Capture everything this process ever touches, including devices created after this call and traffic
  // attributed to an id the hub hasn't heard of yet. `device_id` is ignored when this is set. Without it,
  // turning capture on for "all devices" only ever reached the ones that already existed — which is the
  // wrong answer for a driver that is restarting, or a transport sibling created on the next config save.
  bool everything = 3;
}
message SetDiagnosticsResponse { bool ok = 1; }

message GetDiagnosticsRequest {
  string device_id = 1;   // empty means every device
  int64 after_seq = 2;    // only records newer than this sequence; 0 for everything still held
}

message DiagnosticsMessage {
  bool enabled = 1;                        // whether capture is currently on for the asked device(s)
  repeated DiagnosticRecord records = 2;
}

// One moment on the wire, already redacted by the driver. `text` is the human line; `detail` carries the
// extra a bug report wants (an exception, a response body) without cluttering the summary.
message DiagnosticRecord {
  int64 seq = 1;                           // monotonic per driver, so the live view can poll incrementally
  int64 timestamp_unix_ms = 2;
  string device_id = 3;
  string transport = 4;                    // "tcp", "serial", "http", "udp", "ws", "bt", "btle", ...
  string direction = 5;                    // "tx" | "rx" | "open" | "close" | "error" | "info" | "event"
  string text = 6;
  string detail = 7;

  // Where this happened, in whatever terms the transport uses: "10.0.0.5:23", "/dev/ttyUSB0 at 9600 baud",
  // a URL's origin, a MAC. The hub groups a timeline by it, which is what lets one device's three routes be
  // told apart at a glance.
  string endpoint = 8;

  // The bytes exactly as they went past, hex, uppercase, no separators. Text is a lossy rendering of a
  // binary protocol — and for the gear that is binary, the hex is the only version worth having.
  string hex = 9;
}
